[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robert-cyb-negbuild"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出评测的负样本构造上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "robert-cyb" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://robert-cyb.github.io"
Repository = "https://github.com/robert-cyb/negbuild"
Issues = "https://github.com/robert-cyb/negbuild/issues"

[project.scripts]
negbuild = "negbuild:main"

[tool.setuptools]
py-modules = ["negbuild"]
